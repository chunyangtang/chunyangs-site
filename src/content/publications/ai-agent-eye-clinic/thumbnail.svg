<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">AI-TEC: a proposed ophthalmic care pathway</title>
  <desc id="description">A simplified workflow from pre-visit intake to AI-supported triage and assessment, the ophthalmologist's final clinical decision, and follow-up support. Expert-reviewed data and coordination between agents support the pathway. This is a conceptual summary of the supplied figures, not a depiction of measured patient outcomes or of every capability already deployed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M3 3 16 10 3 17" fill="none" stroke="#89939f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="data-arrow" viewBox="0 0 16 16" refX="12" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M3 3 12 8 3 13" fill="none" stroke="#be6968" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#263342" flood-opacity=".045"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #253140; }
      .muted { fill: #64717e; }
      .icon { fill: none; stroke: #344353; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
      .red { stroke: #ca3132; }
      .label { font-size: 43px; font-weight: 700; letter-spacing: -.8px; }
      .note { font-size: 25px; }
      .phase { font-size: 28px; font-weight: 600; letter-spacing: .3px; }
    </style>
  </defs>

  <!-- Quiet paper ground; no external images, fonts, or scripts. -->
  <rect width="1200" height="900" rx="24" fill="#fcfbf9"/>
  <rect x="64" y="56" width="7" height="56" rx="3.5" fill="#ca3132"/>
  <text x="90" y="104" class="ink" font-size="64" font-weight="700" letter-spacing="-2.5">AI-TEC</text>
  <text x="1136" y="94" class="muted" font-size="24" text-anchor="end">Proposed care pathway</text>
  <path d="M64 145H1136" stroke="#e3e5e5" stroke-width="2"/>

  <!-- Three temporal phases; both AI support and clinical judgment sit within the visit. -->
  <text x="174" y="220" class="phase muted" text-anchor="middle">Before visit</text>
  <text x="600" y="220" class="phase muted" text-anchor="middle">During visit</text>
  <text x="1026" y="220" class="phase muted" text-anchor="middle">After visit</text>
  <path d="M350 240H850" stroke="#d9bbba" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="340" y="268" width="520" height="338" rx="30" fill="#f7eeec"/>

  <!-- Main care sequence. -->
  <g fill="none" stroke="#89939f" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M278 370H350"/>
    <path d="M562 370H634"/>
    <path d="M846 370H918"/>
  </g>
  <g filter="url(#soft-shadow)">
    <circle cx="174" cy="370" r="94" fill="#ffffff" stroke="#dce1e5" stroke-width="2.5"/>
    <circle cx="458" cy="370" r="94" fill="#fffaf8" stroke="#d68583" stroke-width="3"/>
    <circle cx="742" cy="370" r="94" fill="#ffffff" stroke="#d7b6b4" stroke-width="2.5"/>
    <circle cx="1026" cy="370" r="94" fill="#ffffff" stroke="#dce1e5" stroke-width="2.5"/>
  </g>

  <!-- Intake: a person and the structured conversation before the visit. -->
  <g class="icon">
    <circle cx="158" cy="349" r="23"/>
    <path d="M117 416v-13c0-21 18-36 41-36s41 15 41 36v13"/>
    <path d="M139 414v-13m38 13v-13" stroke="#92a0ac" stroke-width="4"/>
    <path d="M189 320h37a10 10 0 0 1 10 10v23a10 10 0 0 1-10 10h-14l-15 12v-12h-8a10 10 0 0 1-10-10v-23a10 10 0 0 1 10-10Z" fill="#fff" stroke="#ca3132" stroke-width="4.5"/>
    <path d="M193 335h28m-28 13h19" stroke="#ca3132" stroke-width="4"/>
  </g>

  <!-- Clinical AI: an eye for ophthalmic assessment and a small processor. -->
  <g class="icon">
    <path d="M397 363c16-28 37-43 61-43s45 15 61 43c-16 28-37 43-61 43s-45-15-61-43Z" stroke="#ca3132"/>
    <circle cx="458" cy="363" r="22"/>
    <circle cx="458" cy="363" r="7" fill="#ca3132" stroke="none"/>
    <rect x="482" y="391" width="42" height="42" rx="7" fill="#fffaf8" stroke="#ca3132" stroke-width="4.5"/>
    <rect x="494" y="403" width="18" height="18" rx="3" stroke="#ca3132" stroke-width="3.5"/>
    <path d="M492 385v6m11-6v6m11-6v6m-22 42v6m11-6v6m11-6v6m-38-37h6m-6 11h6m42-11h6m-6 11h6" stroke="#ca3132" stroke-width="3.5"/>
  </g>

  <!-- Ophthalmologist: the final clinical decision remains with the clinician. -->
  <g class="icon">
    <circle cx="742" cy="339" r="24"/>
    <path d="M693 422v-20c0-23 21-39 49-39s49 16 49 39v20"/>
    <path d="m719 369 23 31 23-31m-23 31v25" stroke-width="4.5"/>
    <path d="M711 374v15a10 10 0 0 0 20 0v-10" stroke="#8896a3" stroke-width="4"/>
    <circle cx="731" cy="375" r="4" fill="#8896a3" stroke="none"/>
    <path d="M772 390v21m-10-10h20" class="red" stroke-width="5"/>
  </g>

  <!-- Follow-up: ongoing patient communication and monitoring. -->
  <g class="icon">
    <rect x="994" y="310" width="65" height="119" rx="13"/>
    <path d="M1015 321h23m-19 96h15" stroke="#8896a3" stroke-width="4"/>
    <path d="M1022 339h44a10 10 0 0 1 10 10v28a10 10 0 0 1-10 10h-17l-13 12v-12h-14a10 10 0 0 1-10-10v-28a10 10 0 0 1 10-10Z" fill="#fff" stroke="#ca3132" stroke-width="4.5"/>
    <path d="m1026 363 10 10 19-20" class="red" stroke-width="5"/>
  </g>

  <g text-anchor="middle">
    <text x="174" y="526" class="label ink">Intake</text>
    <text x="458" y="526" class="label ink">AI support</text>
    <text x="742" y="526" class="label ink">Clinician</text>
    <text x="1026" y="526" class="label ink">Follow-up</text>
    <text x="174" y="566" class="note muted">History &amp; symptoms</text>
    <text x="458" y="566" class="note muted">Triage &amp; assessment</text>
    <text x="742" y="566" font-size="27" font-weight="600" fill="#a02c30">Final decision</text>
    <text x="1026" y="566" class="note muted">Monitoring &amp; support</text>
  </g>

  <!-- Supporting layer: annotation quality from figure 2, coordination from figure 1. -->
  <path d="M458 700V622" fill="none" stroke="#be6968" stroke-width="3" stroke-dasharray="5 8" stroke-linecap="round" marker-end="url(#data-arrow)"/>
  <rect x="64" y="704" width="1072" height="130" rx="22" fill="#f0f1ef"/>
  <path d="M600 735v68" stroke="#d8ddde" stroke-width="2"/>

  <g transform="translate(108 739)" fill="none" stroke="#7a8893" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="27" cy="8" rx="25" ry="9"/>
    <path d="M2 8v37c0 5 11 9 25 9s25-4 25-9V8M2 26c0 5 11 9 25 9s25-4 25-9"/>
    <circle cx="49" cy="43" r="16" fill="#f0f1ef" stroke="#ca3132"/>
    <path d="m42 43 5 5 10-11" stroke="#ca3132" stroke-width="3.5"/>
  </g>
  <text x="194" y="763" class="ink" font-size="32" font-weight="600">Expert-reviewed</text>
  <text x="194" y="801" class="muted" font-size="30">data</text>

  <g transform="translate(650 743)" fill="none" stroke="#7a8893" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 13 46 29 12 48m34-19 34-16m-34 16 34 19"/>
    <circle cx="12" cy="13" r="8" fill="#f0f1ef"/>
    <circle cx="12" cy="48" r="8" fill="#f0f1ef"/>
    <circle cx="80" cy="13" r="8" fill="#f0f1ef"/>
    <circle cx="80" cy="48" r="8" fill="#f0f1ef"/>
    <circle cx="46" cy="29" r="11" fill="#f0f1ef" stroke="#ca3132"/>
  </g>
  <text x="760" y="763" class="ink" font-size="32" font-weight="600">Coordinated</text>
  <text x="760" y="801" class="muted" font-size="30">agents</text>
</svg>
